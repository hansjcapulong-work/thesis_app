name: thesis_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  shared_preferences: ^2.5.5
  fluttertoast: ^9.1.0
  cloud_firestore: ^6.6.0
  youtube_player_flutter: ^9.1.3
  cloud_functions: ^6.3.3
  record: ^7.1.1
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  video_player: ^2.8.2
  http: ^1.6.0
  camera: ^0.12.0+2
  hand_landmarker: ^3.0.1
  tflite_flutter: ^0.12.1
  flutter_tts: ^4.2.5
  flutter_3d_controller: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - images/blindilu.png
    - images/deafillustration.png
    - images/communicating.png
    - images/WOMAN.png
    - assets/gesture_landmarks/
    - assets/model/sign_language_model.tflite
    - assets/model/labels.txt
    - assets/model/Anim_Avatar.glb
    - assets/model/Male1.glb
    - assets/model/Male2.glb
    - assets/model/Female1.glb
    - assets/model/Female2.glb
    - assets/avatar_previews/male1.png
    - assets/avatar_previews/male2.png
    - assets/avatar_previews/female1.png
    - assets/avatar_previews/female2.png